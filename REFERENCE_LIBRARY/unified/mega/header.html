<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three-Row Header Example</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --primary-color: #007bff;
      --secondary-color: #ffc107;
      --light-gray: #f8f9fa;
      --dark-color: #222;
    }

    body {
      font-family: 'Poppins', sans-serif;
    }

    /* Top Bar */
    .top-bar {
      background: var(--light-gray);
      font-size: 0.9rem;
      padding: 6px 0;
    }
    .top-bar a {
      color: #333;
      text-decoration: none;
      margin-right: 15px;
    }

    /* Middle Bar */
    .middle-bar {
      background: #fff;
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary-color);
      text-decoration: none;
    }
    .search-bar input {
      border-radius: 0;
      border-right: 0;
    }
    .search-bar button {
      border-radius: 0;
    }
    .icon-links a {
      color: var(--dark-color);
      font-size: 1.3rem;
      margin-left: 18px;
      position: relative;
    }
    .icon-links a span {
      position: absolute;
      top: -6px;
      right: -10px;
      background: var(--secondary-color);
      color: #000;
      font-size: 0.7rem;
      padding: 1px 5px;
      border-radius: 50%;
    }

    /* Bottom Navigation */
    .bottom-nav {
      background: var(--primary-color);
    }
    .bottom-nav .nav-link {
      color: #fff !important;
      font-weight: 500;
      padding: 10px 18px;
    }
    .bottom-nav .nav-link:hover {
      background: var(--secondary-color);
      color: #000 !important;
    }
    .category-btn {
      background: var(--secondary-color);
      border: none;
      color: #000;
      font-weight: 600;
      padding: 10px 20px;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container d-flex justify-content-between">
      <div>
        <a href="#">🌍 English</a>
        <a href="#">💱 USD</a>
      </div>
      <div>
        <a href="#">Login</a>
        <a href="#">Register</a>
        <a href="#">Wishlist</a>
      </div>
    </div>
  </div>

  <!-- Middle Bar -->
  <div class="middle-bar">
    <div class="container d-flex justify-content-between align-items-center">
      <!-- Logo -->
      <a href="#" class="logo">Elezone</a>

      <!-- Search Bar -->
      <form class="d-flex search-bar w-50" role="search">
        <input class="form-control" type="search" placeholder="Search products..." aria-label="Search">
        <button class="btn btn-warning" type="submit"><i class="bi bi-search"></i></button>
      </form>

      <!-- Icons -->
      <div class="icon-links d-flex align-items-center">
        <a href="#"><i class="bi bi-person"></i></a>
        <a href="#"><i class="bi bi-heart"></i><span>2</span></a>
        <a href="#"><i class="bi bi-cart"></i><span>3</span></a>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bottom-nav">
    <div class="container">
      <!-- Category Dropdown -->
      <div class="dropdown me-3">
        <button class="btn category-btn dropdown-toggle" type="button" data-bs-toggle="dropdown">
          All Categories
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#">Electronics</a></li>
          <li><a class="dropdown-item" href="#">Accessories</a></li>
          <li><a class="dropdown-item" href="#">Cameras</a></li>
          <li><a class="dropdown-item" href="#">Smart Devices</a></li>
        </ul>
      </div>

      <!-- Navbar Links -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Deals</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Blog</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
