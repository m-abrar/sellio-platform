<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XStore Inspired Hero Slider</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: #f9f9f9;
            overflow-x: hidden;
        }

        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 2rem;
            position: relative;
        }

        /* Entrance Animations */
        .reveal-up {
            opacity: 0;
            transform: translateY(30px);
            animation: revealUp 0.8s ease forwards;
        }

        .reveal-delay-1 { animation-delay: 0.2s; }
        .reveal-delay-2 { animation-delay: 0.4s; }
        .reveal-delay-3 { animation-delay: 0.6s; }

        @keyframes revealUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* The Stacked Image Effect & Floating */
        .image-stack {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 400px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .card {
            position: absolute;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: #fff;
            border: 1px solid #eee;
            overflow: hidden;
        }

        .card-main {
            z-index: 3;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .card-mid {
            z-index: 2;
            width: 95%;
            height: 95%;
            top: -25px;
            right: -25px;
            opacity: 0.8;
            background: #fdfdfd;
        }

        .card-bottom {
            z-index: 1;
            width: 90%;
            height: 90%;
            top: -50px;
            right: -50px;
            opacity: 0.5;
            background: #fafafa;
        }

        .image-stack:hover .card-mid {
            transform: translate(25px, -25px) scale(1.02);
            opacity: 1;
        }

        .image-stack:hover .card-bottom {
            transform: translate(50px, -50px) scale(1.04);
            opacity: 0.8;
        }

        /* Typewriter Styles */
        .typewriter-text {
            color: #222;
        }

        .cursor-blink {
            display: inline-block;
            width: 4px;
            height: 1em;
            background-color: #76c043;
            margin-left: 5px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Buttons */
        .btn-green {
            background-color: #76c043;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-green:hover {
            background-color: #65a639;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 20px rgba(118, 192, 67, 0.3);
        }

        .btn-outline {
            background: #222;
            color: #fff;
            transition: all 0.3s ease;
            border: 2px solid #222;
        }
        .btn-outline:hover {
            background: transparent;
            color: #222;
            transform: translateY(-5px);
        }

        /* Mock UI Helpers */
        .browser-bar {
            height: 30px;
            background: #f1f1f1;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 6px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd; }
        
        .shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #f8f8f8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* NEW: Slide & Scale Transition Classes */
        .slide-content-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .slide-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.5s ease;
        }

        /* Transition States */
        .slide-out {
            transform: translateX(-100%) scale(0.9);
            opacity: 0;
        }
        .slide-in-right {
            transform: translateX(100%) scale(1.1);
            opacity: 0;
        }
        .slide-active {
            transform: translateX(0) scale(1);
            opacity: 1;
            z-index: 10;
        }

        .info-card-transition {
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.4s ease;
        }
        .info-hidden {
            transform: translateY(20px);
            opacity: 0;
        }
    </style>
</head>
<body>

    <section class="hero-section container mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center w-full">
            
            <!-- Left Side: Content -->
            <div class="space-y-8 z-10 px-4">
                <div class="space-y-6">
                    <h1 class="text-5xl md:text-7xl font-extrabold text-gray-900 leading-[1.1] tracking-tighter reveal-up">
                        #1 Most Complete <br>
                        <span id="typewriter" class="typewriter-text text-gray-900"></span><span class="cursor-blink"></span><br>
                        Theme
                    </h1>
                    <p class="text-xl text-gray-600 max-w-lg leading-relaxed reveal-up reveal-delay-1">
                        XStore is the all-in-one solution for your professional e-commerce store. 
                        It's fast, customizable, and ready for the future of digital retail.
                    </p>
                </div>

                <div class="flex flex-wrap gap-4 reveal-up reveal-delay-2">
                    <button class="btn-green text-white px-10 py-5 rounded-full font-bold text-lg shadow-lg">
                        BUY NOW — $59
                    </button>
                    <button class="btn-outline px-10 py-5 rounded-full font-bold text-lg flex items-center gap-2">
                        EXPLORE DEMOS
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>

                <!-- Social Proof / Icons -->
                <div class="pt-8 flex items-center gap-8 opacity-30 grayscale reveal-up reveal-delay-3">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/9/93/Wordpress_Blue_logo.png" alt="WP" class="h-8">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/WooCommerce_logo.svg/1200px-WooCommerce_logo.svg.png" alt="Woo" class="h-6">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/56/Elementor_Logo.svg/1200px-Elementor_Logo.svg.png" alt="Elementor" class="h-8">
                </div>
            </div>

            <!-- Right Side: Stacked Visual -->
            <div class="relative flex justify-center items-center py-24 lg:py-0 reveal-up reveal-delay-1">
                <div class="image-stack">
                    <div class="card card-bottom">
                        <div class="browser-bar"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="p-6 space-y-4">
                            <div class="h-8 w-1/2 shimmer rounded"></div>
                            <div class="h-48 w-full shimmer rounded"></div>
                        </div>
                    </div>
                    <div class="card card-mid">
                        <div class="browser-bar"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                        <div class="p-6">
                            <div class="flex gap-4 mb-6">
                                <div class="w-1/3 h-24 shimmer rounded"></div>
                                <div class="w-2/3 h-24 shimmer rounded"></div>
                            </div>
                            <div class="h-32 shimmer rounded"></div>
                        </div>
                    </div>
                    
                    <!-- Card 1 (Top/Main) -->
                    <div class="card card-main">
                        <div class="browser-bar" style="background: #fff; border-bottom: 1px solid #eee; z-index: 20; position: relative;">
                            <div class="dot" style="background:#ff5f56"></div>
                            <div class="dot" style="background:#ffbd2e"></div>
                            <div class="dot" style="background:#27c93f"></div>
                        </div>
                        
                        <div class="slide-content-wrapper">
                            <!-- Background Image Container -->
                            <div id="slide-bg" class="slide-img slide-active" style="background-image: url('https://images.unsplash.com/photo-1523275335684-37898b6baf30?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80');">
                                <div class="w-full h-full bg-black bg-opacity-5"></div>
                            </div>
                            
                            <!-- Floating Info Box -->
                            <div class="absolute inset-0 p-10 z-20 pointer-events-none">
                                <div id="info-box" class="info-card-transition bg-white p-6 inline-block rounded-xl shadow-2xl mt-24 transform pointer-events-auto">
                                    <p id="slide-subtitle" class="text-xs font-bold text-green-600 uppercase tracking-widest mb-1">New Arrival</p>
                                    <h3 id="slide-title" class="font-extrabold text-xl">Smart Watch V2</h3>
                                    <p id="slide-price" class="text-gray-500 font-medium">$199.00</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </section>

    <script>
        // Typewriter Effect Logic
        const words = ["WooCommerce", "E-commerce", "Professional"];
        let i = 0, j = 0, isDeleting = false;
        const typewriterElement = document.getElementById("typewriter");

        function type() {
            let currentWord = words[i];
            if (isDeleting) {
                typewriterElement.textContent = currentWord.substring(0, j - 1);
                j--;
                if (j == 0) { isDeleting = false; i = (i + 1) % words.length; }
            } else {
                typewriterElement.textContent = currentWord.substring(0, j + 1);
                j++;
                if (j == currentWord.length) { isDeleting = true; setTimeout(type, 2000); return; }
            }
            setTimeout(type, isDeleting ? 50 : 150);
        }

        // --- Slide Rotation Logic (Slide & Scale) ---
        const slides = [
            {
                image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80',
                subtitle: 'New Arrival', title: 'Smart Watch V2', price: '$199.00'
            },
            {
                image: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80',
                subtitle: 'Best Seller', title: 'Noise Cancel Headphone', price: '$299.00'
            },
            {
                image: 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80',
                subtitle: 'Exclusive', title: 'Retro Film Camera', price: '$149.00'
            }
        ];

        let currentSlide = 0;
        const slideBg = document.getElementById('slide-bg');
        const infoBox = document.getElementById('info-box');
        const sSubtitle = document.getElementById('slide-subtitle');
        const sTitle = document.getElementById('slide-title');
        const sPrice = document.getElementById('slide-price');

        function rotateSlides() {
            // 1. Slide Current out to left and Hide info
            slideBg.classList.add('slide-out');
            slideBg.classList.remove('slide-active');
            infoBox.classList.add('info-hidden');
            
            setTimeout(() => {
                // 2. Prepare next slide from right
                currentSlide = (currentSlide + 1) % slides.length;
                const data = slides[currentSlide];
                
                // Change Data while hidden/off-screen
                slideBg.style.backgroundImage = `url('${data.image}')`;
                slideBg.classList.remove('slide-out');
                slideBg.classList.add('slide-in-right');
                
                // Force Reflow
                slideBg.offsetWidth;
                
                // 3. Slide in to active position
                slideBg.classList.remove('slide-in-right');
                slideBg.classList.add('slide-active');
                
                // Update text and reveal info box
                setTimeout(() => {
                    sSubtitle.textContent = data.subtitle;
                    sTitle.textContent = data.title;
                    sPrice.textContent = data.price;
                    infoBox.classList.remove('info-hidden');
                }, 200);

            }, 800);
        }

        window.onload = () => {
            setTimeout(type, 1000);
            setInterval(rotateSlides, 5000);
        };
    </script>
</body>
</html>
